# Extends Keycloak's own login theme: anything not in this folder (templates,
# CSS, images, texts) is taken from keycloak.v2.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the parent's file (resolved through the theme chain);
# css/mimer.css is loaded after it and overrides it.
styles=css/styles.css css/mimer.css
scripts=js/normalize-login-id.global.js
# The languages this theme has texts for. This does not hide the language picker: the
# realm's Localization settings do (internationalization on, supported locales sv only).
locales=sv

# keycloak.v2 follows the visitor's OS dark mode by default; mimer.nu is light only.
darkMode=false
