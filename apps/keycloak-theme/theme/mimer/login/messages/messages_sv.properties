# Mimer BankID identity provider (apps/keycloak-bankid-provider): start failed, rejected or Mimer BankID unreachable
bankidLoginFailed=Det gick inte att logga in med BankID. Försök igen om en stund.
# BankID succeeded but no user has that personnummer (the first-login flow never creates one).
# Error page. Keycloak's text prints {0} = the personnummer, so this one uses no placeholders.
# Tenants not in Keycloak yet are pointed at kundcenter, so they don't register as applicants
# and get a second contact for the same personnummer.
federatedIdentityUnavailableMessage=Vi hittar inget konto för ditt personnummer. Är du hyresgäst hos oss? Kontakta kundcenter. Annars kan du registrera dig på Mina sidor.
# The user cancelled in the BankID app or on the BankID page. Login page. Keycloak passes {0} =
# the identity provider's display name, or its alias when none is set, so the text names BankID itself.
access-denied-when-idp-auth=Inloggningen med BankID avbröts.
