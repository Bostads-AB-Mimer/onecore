# Choosing a password, from the set-password e-mail core sends at registration or from
# "Glömt lösenord". Keycloak's own Swedish lacks these keys, so without them the pages fall
# back to English.
# The page the e-mail link opens: "<confirmExecutionOfActions>: <requiredAction.*>", then a link
