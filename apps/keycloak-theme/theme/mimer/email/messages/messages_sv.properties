# Texts for the e-mails Keycloak sends from the tenant realm, overriding Keycloak's own Swedish.
# Arguments are MessageFormat: a literal apostrophe has to be written ''.

# Set-password e-mail. Core sends it when it registers a new applicant
# (execute-actions-email with UPDATE_PASSWORD). The text assumes that is the only action, so
# don't send other required actions through this e-mail.
# {0} link, {4} the link's lifespan in words (Keycloak's {1} is raw minutes)
executeActionsSubject=Välj lösenord till Mina sidor
executeActionsBody=Hej!\n\nVälkommen till Mina sidor hos Mimer. Öppna länken nedan för att välja ditt lösenord.\n\n{0}\n\nLänken gäller i {4}. Har den hunnit gå ut kan du i stället välja Glömt lösenord på inloggningssidan.\n\nHar du inte registrerat dig hos Mimer kan du bortse från det här mejlet.\n\nVänliga hälsningar\nBostads AB Mimer
executeActionsBodyHtml=<p>Hej!</p><p>Välkommen till Mina sidor hos Mimer. Klicka på länken nedan för att välja ditt lösenord.</p><p><a href="{0}">Välj lösenord</a></p><p>Länken gäller i {4}. Har den hunnit gå ut kan du i stället välja <strong>Glömt lösenord</strong> på inloggningssidan.</p><p>Har du inte registrerat dig hos Mimer kan du bortse från det här mejlet.</p><p>Vänliga hälsningar<br>Bostads AB Mimer</p>

# "Glömt lösenord" on the login page.
# {0} link, {3} the link's lifespan in words
passwordResetSubject=Återställ lösenord till Mina sidor
passwordResetBody=Hej!\n\nNågon har bett om att återställa lösenordet till ditt konto på Mina sidor hos Mimer. Var det du, öppna länken nedan för att välja ett nytt lösenord.\n\n{0}\n\nLänken gäller i {3}.\n\nVar det inte du kan du bortse från det här mejlet. Ditt lösenord ändras inte.\n\nVänliga hälsningar\nBostads AB Mimer
passwordResetBodyHtml=<p>Hej!</p><p>Någon har bett om att återställa lösenordet till ditt konto på Mina sidor hos Mimer. Var det du, klicka på länken nedan för att välja ett nytt lösenord.</p><p><a href="{0}">Välj nytt lösenord</a></p><p>Länken gäller i {3}.</p><p>Var det inte du kan du bortse från det här mejlet. Ditt lösenord ändras inte.</p><p>Vänliga hälsningar<br>Bostads AB Mimer</p>

# The words for a link's lifespan ("12 timmar"). Keycloak's Swedish has none, so without these
# the lifespan reads "12 hours".
linkExpirationFormatter.timePeriodUnit.seconds={0,choice,0#sekunder|1#sekund|1<sekunder}
linkExpirationFormatter.timePeriodUnit.minutes={0,choice,0#minuter|1#minut|1<minuter}
linkExpirationFormatter.timePeriodUnit.hours={0,choice,0#timmar|1#timme|1<timmar}
linkExpirationFormatter.timePeriodUnit.days={0,choice,0#dagar|1#dag|1<dagar}
