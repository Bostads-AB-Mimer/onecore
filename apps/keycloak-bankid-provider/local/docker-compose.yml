# Local check of the plugin: two clustered Keycloak nodes on the same image and mode as auth.dev.mimer.nu,
# with the JAR and a file vault mounted. Used by ./run.sh.
# Ports are bound to loopback: in `real` mode the admin (admin/admin) can repoint the IdP's URLs and so
# receive the Mimer BankID TEST secrets from the vault, so nothing else on the network may reach it.
name: keycloak-bankid-provider
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: keycloak }
  keycloak:
    image: bitnamilegacy/keycloak:26.3.3-debian-12-r0
    depends_on: [db]
    ports: ['127.0.0.1:18081:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      KEYCLOAK_PRODUCTION: 'false'
      KEYCLOAK_DATABASE_HOST: db
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18081
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_MANAGEMENT_PORT: '9000'
      KC_LOG_CONSOLE_OUTPUT: default
      KC_LOG_LEVEL: INFO
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: ispn
      KC_CACHE_CONFIG_FILE: cache-ispn.xml
      KC_CACHE_STACK: jdbc-ping
      KC_VAULT: file
      KC_VAULT_DIR: /opt/bitnami/keycloak/vault
    volumes:
      - ../target/mimer-bankid-provider.jar:/opt/bitnami/keycloak/providers/mimer-bankid-provider.jar:ro
      - ./vault:/opt/bitnami/keycloak/vault:ro
  keycloak2:
    image: bitnamilegacy/keycloak:26.3.3-debian-12-r0
    depends_on: [db, keycloak]
    ports: ['127.0.0.1:18082:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      KEYCLOAK_PRODUCTION: 'false'
      KEYCLOAK_DATABASE_HOST: db
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18081
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_MANAGEMENT_PORT: '9000'
      KC_LOG_CONSOLE_OUTPUT: default
      KC_LOG_LEVEL: INFO
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: ispn
      KC_CACHE_CONFIG_FILE: cache-ispn.xml
      KC_CACHE_STACK: jdbc-ping
      KC_VAULT: file
      KC_VAULT_DIR: /opt/bitnami/keycloak/vault
    volumes:
      - ../target/mimer-bankid-provider.jar:/opt/bitnami/keycloak/providers/mimer-bankid-provider.jar:ro
      - ./vault:/opt/bitnami/keycloak/vault:ro
